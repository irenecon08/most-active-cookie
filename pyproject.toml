[project]
name = "most-active-cookie"
version = "0.1.0"
description = "Find the most active cookie(s) for a given UTC date in a cookie log file."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
most-active-cookie = "most_active_cookie.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]